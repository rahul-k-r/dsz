name: Check upstream DSZ releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'rahul-k-r/dsz' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check for a published version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/upstream_sync.py
